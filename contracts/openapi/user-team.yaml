openapi: 3.0.4
info:
  title: Teamisty User & Team API
  version: 0.1.0
  description: Health, authentication, profile lookup, refresh-session management, and team and member operations.
servers:
  - url: http://localhost:3001
    description: Direct local User & Team Service
tags:
  - name: Health
  - name: Authentication
  - name: Users
  - name: Teams
paths:
  /health:
    get:
      tags: [Health]
      operationId: getUserTeamHealth
      summary: Check HTTP service health
      description: Reports that the HTTP service is running. PostgreSQL connectivity is checked separately.
      security: []
      responses:
        '200':
          description: The HTTP service is running.
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  service:
                    type: string
                    enum: [user-team-service]
  /auth/signup:
    post:
      tags: [Authentication]
      operationId: signUp
      summary: Create a password-based account
      description: Returns the public profile. Use login to start a session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupInput'
      responses:
        '201':
          $ref: '#/components/responses/CreatedProfile'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '409':
          description: The username or email is already registered (`ACCOUNT_CONFLICT`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      tags: [Authentication]
      operationId: logInWithPassword
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          $ref: '#/components/responses/SessionIssued'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          description: The email or password is incorrect (`INVALID_CREDENTIALS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
  /auth/google:
    get:
      tags: [Authentication]
      operationId: startGoogleSignIn
      summary: Start Google sign-in
      description: Open as a browser navigation. The response sets a short-lived Secure, HttpOnly OAuth state cookie scoped to the callback.
      security: []
      parameters:
        - name: link
          in: query
          description: Pass `1` to link Google to the currently signed-in Teamisty account. This requires an active refresh cookie.
          schema:
            type: string
            enum: ['1']
      responses:
        '302':
          description: Redirect to Google with state, nonce, and the PKCE challenge.
          headers:
            Location:
              schema:
                type: string
                format: uri
            Set-Cookie:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/GoogleSignInFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
  /auth/google/callback:
    get:
      tags: [Authentication]
      operationId: finishGoogleSignIn
      summary: Complete Google sign-in
      description: Google redirects the browser here. A valid OAuth state cookie and matching state are required. This endpoint redirects to the configured frontend callback after creating the session.
      security:
        - GoogleFlowCookie: []
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          description: Google authorization code, required when access was granted.
          schema:
            type: string
        - name: error
          in: query
          description: Google may return an error instead of a code.
          schema:
            type: string
      responses:
        '303':
          description: Refresh session established. The OAuth state cookie is cleared, a refresh cookie is set, and the browser is redirected without app tokens in the URL.
          headers:
            Location:
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: Sent as separate headers to clear the OAuth state and set the refresh session.
              schema:
                type: array
                items:
                  type: string
        '401':
          $ref: '#/components/responses/GoogleSignInFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshSession
      summary: Rotate the refresh session
      description: Revokes the current refresh session and starts a replacement seven-day session. The old cookie cannot be reused.
      security:
        - RefreshCookie: []
      parameters:
        - $ref: '#/components/parameters/TrustedOrigin'
      responses:
        '200':
          $ref: '#/components/responses/SessionIssued'
        '401':
          $ref: '#/components/responses/InvalidRefreshSession'
        '403':
          $ref: '#/components/responses/UntrustedOrigin'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logOut
      summary: Revoke the current refresh session
      description: Clears the refresh cookie. An already-issued access token remains usable until its expiry.
      security:
        - RefreshCookie: []
      parameters:
        - $ref: '#/components/parameters/TrustedOrigin'
      responses:
        '204':
          description: The refresh session was revoked. The response has no body.
          headers:
            Set-Cookie:
              description: Expires the `refreshToken` cookie at the same configured path and SameSite setting.
              schema:
                type: string
              example: 'refreshToken=; Path=/auth; Expires=Thu, 01 Jan 1970 00:00:00 GMT; HttpOnly; Secure; SameSite=Lax'
        '401':
          $ref: '#/components/responses/InvalidRefreshSession'
        '403':
          $ref: '#/components/responses/UntrustedOrigin'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
  /users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Get the signed-in user's public profile
      security:
        - AccessToken: []
      responses:
        '200':
          description: The current user's public profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: A valid access token and an existing user are required (`UNAUTHENTICATED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
  /users/me/teams:
    get:
      tags: [Teams]
      operationId: listMyTeams
      summary: List the caller's active team memberships
      description: Returns active memberships in non-deleted teams in membership creation order.
      security:
        - AccessToken: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of teams with the caller's role in each.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMetadata'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/TeamWithRole'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
  /teams:
    post:
      tags: [Teams]
      operationId: createTeam
      summary: Create a team
      description: Creates the team and its first Owner membership together with a pending board-initialization event. The caller becomes the Owner.
      security:
        - AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Length is checked after trimming surrounding whitespace.
            example:
              name: DevOps Team
      responses:
        '201':
          description: The team was created and its board provisioning is pending.
          content:
            application/json:
              schema:
                type: object
                required: [team, role]
                properties:
                  team:
                    type: object
                    required: [id, name, boardProvisioningStatus]
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      boardProvisioningStatus:
                        type: string
                        enum: [PENDING]
                  role:
                    type: string
                    enum: [OWNER]
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          description: A valid access token and an existing user are required (`UNAUTHENTICATED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
  /teams/{teamId}:
    get:
      tags: [Teams]
      operationId: getTeam
      summary: Get a team and the caller's role
      security:
        - AccessToken: []
      parameters:
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: The team's summary and the caller's active role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamWithRole'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TeamAccessDenied'
        '404':
          $ref: '#/components/responses/TeamNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
    delete:
      tags: [Teams]
      operationId: deleteTeam
      summary: Soft-delete a team
      description: Only the active Owner can delete the team. Team records remain in storage, and the team is no longer available through the team APIs.
      security:
        - AccessToken: []
      parameters:
        - $ref: '#/components/parameters/TeamId'
      responses:
        '204':
          description: Team soft-deleted.
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Only the active Owner can delete the team (`OWNER_REQUIRED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/TeamNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
  /teams/{teamId}/members:
    get:
      tags: [Teams]
      operationId: listTeamMembers
      summary: List a team's active members
      description: Requires an active membership. Returns active members in membership creation order.
      security:
        - AccessToken: []
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of active members and their roles.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMetadata'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/TeamMember'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TeamAccessDenied'
        '404':
          $ref: '#/components/responses/TeamNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
  /teams/{teamId}/members/{userId}:
    delete:
      tags: [Teams]
      operationId: removeTeamMember
      summary: Soft-remove a team member
      description: The Owner can remove Members and the Leader. A Leader can remove Members. Removal requires a successful active-task check with zero assignments.
      security:
        - AccessToken: []
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/MemberUserId'
      responses:
        '204':
          description: Membership soft-removed.
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: The caller cannot remove this member (`TEAM_ACCESS_DENIED`), or the target is the Owner (`OWNER_ROLE_PROTECTED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/TeamOrMemberNotFound'
        '409':
          description: The target has active tasks (`MEMBER_HAS_ACTIVE_TASKS`), or their membership changed during the check (`MEMBERSHIP_CHANGED`). No membership is removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: The active-task check (`TASK_CHECK_UNAVAILABLE`) or authentication configuration (`AUTH_UNAVAILABLE`) is unavailable. No membership is removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /teams/{teamId}/members/{userId}/role:
    patch:
      tags: [Teams]
      operationId: changeTeamMemberRole
      summary: Appoint or demote the team Leader
      description: Only the active Owner can set an active non-Owner membership to LEADER or MEMBER.
      security:
        - AccessToken: []
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/MemberUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role:
                  type: string
                  enum: [LEADER, MEMBER]
      responses:
        '200':
          description: The membership has the requested role.
          content:
            application/json:
              schema:
                type: object
                required: [userId, role]
                properties:
                  userId:
                    type: string
                    format: uuid
                  role:
                    type: string
                    enum: [LEADER, MEMBER]
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: The caller is not the active Owner (`OWNER_REQUIRED`), or the target is the Owner (`OWNER_ROLE_PROTECTED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/TeamOrMemberNotFound'
        '409':
          description: The team already has an active Leader (`LEADER_ALREADY_EXISTS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
  /teams/{teamId}/ownership:
    patch:
      tags: [Teams]
      operationId: transferTeamOwnership
      summary: Transfer ownership to another active team member
      description: Only the active Owner can transfer ownership. The previous Owner becomes a Member. A target who was the Leader frees the Leader slot.
      security:
        - AccessToken: []
      parameters:
        - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [newOwnerId]
              properties:
                newOwnerId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Ownership was transferred in one transaction.
          content:
            application/json:
              schema:
                type: object
                required: [teamId, ownerId, previousOwnerId]
                properties:
                  teamId:
                    type: string
                    format: uuid
                  ownerId:
                    type: string
                    format: uuid
                  previousOwnerId:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Only the active Owner can transfer ownership (`OWNER_REQUIRED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/TeamOrMemberNotFound'
        '409':
          description: The requested user is already the Owner (`ALREADY_OWNER`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
components:
  securitySchemes:
    AccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The 15-minute access token returned by login or refresh.
    RefreshCookie:
      type: apiKey
      in: cookie
      name: refreshToken
      description: Seven-day Secure, HttpOnly refresh cookie. Browser clients use credentialed requests.
    GoogleFlowCookie:
      type: apiKey
      in: cookie
      name: googleOAuth
      description: Short-lived OAuth state cookie issued by the Google sign-in start endpoint.
  parameters:
    MemberUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 21474837
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    TrustedOrigin:
      name: Origin
      in: header
      required: true
      description: An exact origin in `AUTH_TRUSTED_ORIGINS`. Browsers supply this header.
      schema:
        type: string
      example: http://localhost:5173
  schemas:
    TeamRole:
      type: string
      enum: [OWNER, LEADER, MEMBER]
    TeamWithRole:
      type: object
      required: [team, role]
      properties:
        team:
          type: object
          required: [id, name, boardProvisioningStatus]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            boardProvisioningStatus:
              type: string
              enum: [PENDING, READY]
        role:
          $ref: '#/components/schemas/TeamRole'
    TeamMember:
      type: object
      required: [userId, username, displayName, role]
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/TeamRole'
    PageMetadata:
      type: object
      required: [page, limit, hasMore]
      properties:
        page:
          type: integer
        limit:
          type: integer
        hasMore:
          type: boolean
          description: Whether another page of results is available.
    SignupInput:
      type: object
      additionalProperties: false
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
          description: Length is checked after trimming surrounding whitespace.
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          writeOnly: true
          description: Also limited to 72 UTF-8 bytes for bcrypt.
        displayName:
          type: string
          maxLength: 100
          description: Length is checked after trimming surrounding whitespace.
    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 72
          writeOnly: true
          description: Also limited to 72 UTF-8 bytes for bcrypt.
    Email:
      type: string
      format: email
      maxLength: 254
      description: Trimmed before validation and normalized to lowercase.
    UserResponse:
      type: object
      required: [user]
      properties:
        user:
          type: object
          required: [id, username, email, displayName]
          properties:
            id:
              type: string
              format: uuid
            username:
              type: string
            email:
              type: string
              format: email
            displayName:
              type: string
              nullable: true
    AccessTokenResponse:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string
          description: HS256 access JWT valid for 15 minutes.
    Error:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
        requestId:
          type: string
          format: uuid
  responses:
    TeamOrMemberNotFound:
      description: The team does not exist or has been deleted (`TEAM_NOT_FOUND`), or the target is not an active member (`MEMBER_NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: A valid access token is required (`UNAUTHENTICATED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TeamAccessDenied:
      description: Active membership in the team is required (`TEAM_ACCESS_DENIED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TeamNotFound:
      description: The team does not exist or has been deleted (`TEAM_NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CreatedProfile:
      description: Account created.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserResponse'
    SessionIssued:
      description: Access token issued and refresh session set.
      headers:
        Set-Cookie:
          description: Sets the Secure, HttpOnly `refreshToken` cookie for seven days. The default path is `/auth` and SameSite is `Lax`.
          schema:
            type: string
          example: 'refreshToken=<refresh-jwt>; Max-Age=604800; Path=/auth; HttpOnly; Secure; SameSite=Lax'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccessTokenResponse'
    InvalidInput:
      description: Invalid JSON or input validation failed (`INVALID_INPUT`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidRefreshSession:
      description: The refresh cookie is missing, invalid, expired, or revoked (`INVALID_REFRESH_SESSION`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UntrustedOrigin:
      description: The Origin header is missing or is outside the allowlist (`UNTRUSTED_ORIGIN`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: The request could not be completed (`INTERNAL_ERROR`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GoogleSignInFailed:
      description: Google could not authenticate the user or linking requires a signed-in Teamisty account (`GOOGLE_SIGN_IN_FAILED` or `GOOGLE_LINK_REQUIRED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AuthUnavailable:
      description: Required authentication configuration is unavailable or invalid (`AUTH_UNAVAILABLE`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
